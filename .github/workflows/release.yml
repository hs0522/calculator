name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "릴리즈 버전 (v 없이 입력, 예: 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}" -replace "^v", ""
          } else {
            $v = "${{ github.event.inputs.version }}"
          }
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "1.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v tag=v$v"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.10,<7"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Stamp version
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          "APP_VERSION = `"$v`"" | Set-Content -Path "version.py" -Encoding utf8 -NoNewline
          Get-Content "version.py"

      - name: Check pywebview import
        run: python -c "import sys, importlib.metadata as md, webview; print('pywebview', md.version('pywebview'), '| python', sys.version)"

      - name: Build with PyInstaller
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name PilatesCalc
          --icon assets/pilates.ico
          --add-data "web;web"
          --hidden-import clr
          --hidden-import clr_loader
          --hidden-import webview.platforms.edgechromium
          --collect-submodules webview
          --collect-all pythonnet
          --copy-metadata pywebview
          app.py

      - name: Package self test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\PilatesCalc\PilatesCalc.exe" `
            -ArgumentList "--selftest", "--strict" `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput "selftest_out.txt"
          Get-Content "selftest_out.txt"
          if ($p.ExitCode -ne 0) { throw "패키징된 실행 파일 셀프 테스트 실패 (exit $($p.ExitCode))" }

      - name: Create portable zip
        shell: pwsh
        run: Compress-Archive -Path "dist\PilatesCalc" -DestinationPath "dist\PilatesCalc-Windows.zip" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup(ISCC.exe)을 찾지 못했습니다." }
          Write-Host "ISCC: $iscc"
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "installer\pilatescalc.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 빌드 실패 (exit $LASTEXITCODE)" }

      - name: Verify artifacts
        shell: pwsh
        run: |
          Get-ChildItem "dist\installer" | Format-Table Name, Length
          Get-Item "dist\PilatesCalc-Windows.zip" | Format-Table Name, Length
          if (-not (Test-Path "dist\installer\PilatesCalc-Setup.exe")) { throw "설치 파일이 없습니다." }
          if (-not (Test-Path "dist\installer\PilatesCalc-Setup.exe") -or -not (Test-Path "dist\PilatesCalc-Windows.zip")) { throw "산출물이 없습니다." }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PilatesCalc-${{ steps.ver.outputs.version }}-windows
          path: |
            dist/installer/PilatesCalc-Setup.exe
            dist/PilatesCalc-Windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $version = "${{ steps.ver.outputs.version }}"
          $assets = @("dist\installer\PilatesCalc-Setup.exe", "dist\PilatesCalc-Windows.zip")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "기존 릴리즈에 에셋을 덮어씁니다: $tag"
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets `
              --target "${{ github.sha }}" `
              --title "필라테스 계산기 $version" `
              --notes-file ".github/release-notes.md"
          }
          gh release view $tag --json tagName,assets --jq '.tagName, (.assets[] | "\(.name) \(.size)")'
