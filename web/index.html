<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>필라테스 계산기</title>
<style>
  :root{
    --bg:#F6F7FB; --card:#FFFFFF; --line:#EAECEF; --ink:#17181C;
    --muted:#8A8D99; --muted2:#A7AAB5; --label:#5A5F6E;
    --accent:#5B5FE9; --accent-dark:#4F46E5; --accent-tint:#EEEFFE; --track:#F1F2F7;
    --danger:#D1424A;
    --shadow:0 1px 2px rgba(23,24,28,.04), 0 10px 22px rgba(23,24,28,.05);
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--ink); overflow:hidden; user-select:none;
    box-shadow:inset 0 0 0 1px #E9EBF2;
    font-family:"Pretendard","Noto Sans CJK KR","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:12px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  /* ---------- 상단 미니 헤더 (드래그 영역) ---------- */
  .bar{
    height:42px; display:flex; align-items:center; gap:6px; padding:0 8px 0 14px;
    background:transparent; -webkit-app-region:drag;
  }
  .bar h1{
    margin:0; font-size:12px; font-weight:700; letter-spacing:-.02em; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .drag{flex:1 1 auto; min-width:0; height:100%; display:flex; align-items:center; -webkit-app-region:drag;}
  .seg{
    display:flex; gap:2px; padding:3px; background:#ECEEF4; border-radius:999px;
    margin-left:auto; -webkit-app-region:no-drag;
  }
  .seg-btn{
    border:0; background:transparent; border-radius:999px; padding:5px 13px; font:inherit;
    font-size:11px; font-weight:600; color:#6B6F7C; cursor:pointer; white-space:nowrap;
    transition:background .14s,color .14s,box-shadow .14s;
  }
  .seg-btn:hover{color:var(--ink);}
  .seg-btn.is-active{background:var(--accent); color:#fff; box-shadow:0 2px 8px rgba(91,95,233,.32);}
  .win{display:flex; align-items:center; gap:1px; -webkit-app-region:no-drag;}
  .wbtn{
    border:0; background:transparent; color:#9A9DA7; width:23px; height:23px; border-radius:8px;
    cursor:pointer; display:grid; place-items:center; padding:0;
    transition:background .12s,color .12s;
  }
  .wbtn svg{width:13px; height:13px; display:block;}
  .wbtn:hover{background:#EDEFF5; color:var(--ink);}
  .wbtn.is-on{background:var(--accent-tint); color:var(--accent);}
  .wbtn.close:hover{background:#FDECEE; color:var(--danger);}
  .upd{
    border:1px solid #DCDEFB; background:var(--accent-tint); color:var(--accent-dark);
    border-radius:999px; padding:3px 9px; font:inherit; font-size:10px; font-weight:700; cursor:pointer;
    white-space:nowrap;
  }
  .upd:hover{background:#E5E6FD;}

  /* ---------- 본문 ---------- */
  main{
    height:calc(100% - 42px); padding:2px 12px 11px; display:flex; flex-direction:column;
    gap:9px; overflow:hidden;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:11px 13px; box-shadow:var(--shadow);
  }
  .card-head{display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:8px;}
  .card-title{font-size:12px; font-weight:700; letter-spacing:-.02em; color:var(--ink);}
  .hint{font-size:9.5px; color:var(--danger); font-weight:600;}
  .lbl{font-size:10.5px; color:var(--label); letter-spacing:-.01em;}
  .lbl b{color:var(--accent); font-weight:700; font-variant-numeric:tabular-nums;}
  .sec{margin:0 0 6px;}
  .pills{display:grid; grid-template-columns:repeat(4,1fr); gap:5px;}
  .pills.three{grid-template-columns:repeat(3,1fr);}
  .pill{
    border:1px solid #E7E9F0; background:#FAFBFD; border-radius:9px; padding:6px 0;
    font:inherit; font-size:11.5px; font-weight:600; color:#4A4E5A; cursor:pointer;
    font-variant-numeric:tabular-nums;
    transition:border-color .12s,background .12s,color .12s,box-shadow .12s;
  }
  .pill:hover{border-color:#CFD2E0; color:var(--ink);}
  .pill.is-active{
    border-color:var(--accent); background:var(--accent-tint); color:var(--accent-dark);
    font-weight:700; box-shadow:0 1px 3px rgba(91,95,233,.16);
  }
  .foot{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px;}
  .sel-note{font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .link{border:0; background:transparent; padding:0; font:inherit; font-size:10.5px; font-weight:600; color:var(--accent); cursor:pointer; white-space:nowrap;}
  .link:hover{color:var(--accent-dark); text-decoration:underline; text-underline-offset:3px;}
  .custom{margin-top:9px; padding-top:9px; border-top:1px solid var(--line); display:grid; gap:7px;}
  .custom.is-flush{margin-top:7px; padding-top:0; border-top:0;}
  .inline{display:flex; align-items:center; gap:6px;}
  input,select{
    width:100%; font:inherit; font-size:12px; color:inherit; background:#FBFBFE; border:1px solid #E3E6EE;
    border-radius:10px; padding:8px 10px; outline:none; transition:border-color .12s,box-shadow .12s,background .12s;
  }
  input:focus,select:focus{border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px rgba(91,95,233,.12);}
  input::placeholder{color:#B4B7C2;}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;appearance:textfield;}
  .suffix{font-size:10.5px; color:var(--muted2); white-space:nowrap;}
  .ghost{
    border:0; background:var(--track); border-radius:10px; padding:9px 12px; font:inherit;
    font-size:11px; font-weight:600; color:#4A4E5A; cursor:pointer; white-space:nowrap;
    transition:background .12s,color .12s;
  }
  .ghost:hover{background:#E8EAF2; color:var(--ink);}
  .duo{display:grid; grid-template-columns:1.35fr 1fr; gap:6px;}

  /* ---------- 만료일 탭: 종류별 기간 스테퍼 ---------- */
  .rows{display:grid; gap:7px;}
  .mrow{
    border:1px solid #E7E9F0; background:#FAFBFD; border-radius:12px; padding:7px 9px 8px;
    display:grid; gap:6px; transition:border-color .12s,background .12s,box-shadow .12s;
  }
  .mrow.is-active{border-color:var(--accent); background:var(--accent-tint); box-shadow:0 1px 3px rgba(91,95,233,.16);}
  .mrow-head{display:flex; align-items:center; gap:6px; min-width:0;}
  .mkind{font-size:10.5px; font-weight:700; color:#4A4E5A; letter-spacing:-.01em; white-space:nowrap;}
  .mrow.is-active .mkind{color:var(--accent-dark);}
  .chips{display:flex; gap:4px; margin-left:auto;}
  .chip{
    border:1px solid #E3E6EE; background:#fff; border-radius:999px; padding:2px 8px; font:inherit;
    font-size:10px; font-weight:600; color:#5A5F6E; cursor:pointer; font-variant-numeric:tabular-nums;
    transition:border-color .12s,color .12s;
  }
  .chip:hover{border-color:#CFD2E0; color:var(--ink);}
  .chip.is-active{border-color:var(--accent); color:var(--accent-dark); font-weight:700;}
  .stepper{display:flex; align-items:center; gap:6px;}
  .step{
    width:30px; height:30px; flex:0 0 30px; border:1px solid #E3E6EE; background:#fff; border-radius:10px;
    font:inherit; font-size:15px; font-weight:600; color:#4A4E5A; line-height:1; padding:0;
    cursor:pointer; display:grid; place-items:center; transition:background .12s,border-color .12s,color .12s;
  }
  .step:hover{background:#F2F3FA; border-color:#CFD2E0; color:var(--ink);}
  .step:disabled{color:#C9CCD6; cursor:default; background:#F7F8FC; border-color:#EDEFF5;}
  .stepnum{
    width:58px; flex:0 0 58px; text-align:center; padding:6px 4px; font-weight:700;
    background:#fff; font-variant-numeric:tabular-nums;
  }
  .stepunit{font-size:10.5px; color:var(--label); margin-left:auto; padding-right:2px;}

  /* ---------- 결과 ---------- */
  .result{
    flex:1; min-height:0; background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:12px 13px 13px; display:flex; flex-direction:column; overflow:hidden;
    box-shadow:var(--shadow);
  }
  .rlabel{margin:0; font-size:10.5px; font-weight:600; color:var(--muted);}
  .hero{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; justify-content:center;}
  .big{
    margin:4px 0 0; font-size:29px; font-weight:800; line-height:1.08; letter-spacing:-.035em;
    font-variant-numeric:tabular-nums;
  }
  .big.is-empty{color:#C9CCD6;}
  .sub{margin:4px 0 0; font-size:10.5px; color:var(--muted); min-height:15px;}
  .sub.is-error{color:var(--danger);}
  .kpis{
    margin:9px 0 9px; display:grid; grid-template-columns:1fr 1fr; gap:6px;
    overflow-y:auto; min-height:0; scrollbar-width:thin; align-content:start;
  }
  .kpis::-webkit-scrollbar{width:4px;}
  .kpis::-webkit-scrollbar-thumb{background:#DFE1EA; border-radius:4px;}
  .kpis.is-single{grid-template-columns:1fr;}
  .kpi{background:#F4F5FB; border-radius:11px; padding:6px 9px; min-width:0;}
  .kpi .k{
    display:block; font-size:9px; font-weight:700; color:var(--accent); line-height:1.3;
    letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .kpi .v{
    display:block; font-size:13px; font-weight:700; color:var(--ink); line-height:1.3;
    letter-spacing:-.02em; font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .kpi .s{display:block; font-size:8.5px; color:#9A9DA7; line-height:1.3; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .copy{
    margin-top:0; width:100%; border:0; border-radius:12px; padding:10px; background:var(--accent);
    color:#fff; font:inherit; font-size:12px; font-weight:700; letter-spacing:-.01em; cursor:pointer;
    box-shadow:0 7px 16px rgba(91,95,233,.28); transition:background .12s,box-shadow .12s;
  }
  .copy:hover{background:var(--accent-dark); box-shadow:0 7px 16px rgba(79,70,229,.32);}
  .copy:disabled{background:#E8EAF2; color:#A7AAB5; cursor:default; box-shadow:none;}
  .toast{
    position:fixed; left:50%; bottom:14px; transform:translate(-50%,6px); background:#1C1D24; color:#fff;
    font-size:10.5px; font-weight:600; padding:7px 13px; border-radius:999px; opacity:0; pointer-events:none;
    transition:opacity .16s,transform .16s; z-index:9;
  }
  .toast.is-shown{opacity:1; transform:translate(-50%,0);}

  /* 창을 최소 높이까지 줄였을 때 */
  @media (max-height:520px){
    main{padding:0 10px 10px; gap:8px; overflow-y:auto;}
    .card{padding:10px 11px;}
    .pill{padding:4px 0; font-size:11px;}
    .result{flex:0 0 auto;}
    .big{font-size:25px;}
    .kpis{overflow:visible;}
    .copy{padding:9px;}
  }
</style>
</head>
<body>
  <header class="bar" id="dragbar">
    <div class="drag pywebview-drag-region"><h1>필라테스 계산기</h1></div>
    <nav class="seg">
      <button class="seg-btn is-active" data-tab="date" type="button">만료일</button>
      <button class="seg-btn" data-tab="refund" type="button">환불</button>
    </nav>
    <div class="win">
      <button class="upd" id="btn-update" type="button" hidden>업데이트</button>
      <button class="wbtn is-on" id="btn-pin" type="button" title="항상 위 고정" aria-label="항상 위 고정">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2.6h10"/><path d="M8 13.2V5.6"/><path d="M4.9 8.7 8 5.6l3.1 3.1"/></svg>
      </button>
      <button class="wbtn" id="btn-min" type="button" title="최소화" aria-label="최소화">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.4 8h9.2"/></svg>
      </button>
      <button class="wbtn close" id="btn-close" type="button" title="닫기" aria-label="닫기">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="card-head">
        <span class="card-title">회원권</span>
        <span class="hint" id="rate-note"></span>
      </div>
      <div class="rows" id="date-block">
        <div class="mrow" data-kind="group">
          <div class="mrow-head">
            <span class="mkind">6:1 그룹</span>
            <div class="chips" id="chips-group"></div>
          </div>
          <div class="stepper">
            <button class="step" type="button" data-kind="group" data-step="-1" aria-label="그룹 기간 줄이기">−</button>
            <input class="stepnum" id="num-group" data-kind="group" type="number" min="1" step="1" inputmode="numeric" value="2" aria-label="그룹 기간">
            <button class="step" type="button" data-kind="group" data-step="1" aria-label="그룹 기간 늘리기">+</button>
            <span class="stepunit">개월</span>
          </div>
        </div>
        <div class="mrow" data-kind="personal">
          <div class="mrow-head">
            <span class="mkind">1:1 개인</span>
            <div class="chips" id="chips-personal"></div>
          </div>
          <div class="stepper">
            <button class="step" type="button" data-kind="personal" data-step="-1" aria-label="개인 기간 줄이기">−</button>
            <input class="stepnum" id="num-personal" data-kind="personal" type="number" min="1" step="1" inputmode="numeric" value="10" aria-label="개인 기간">
            <button class="step" type="button" data-kind="personal" data-step="1" aria-label="개인 기간 늘리기">+</button>
            <span class="stepunit">주</span>
          </div>
        </div>
      </div>
      <div class="presets" id="presets-block" hidden>
        <p class="lbl sec">6:1 그룹<span id="rate-group-slot" hidden> · 회당 <b id="rate-group">22,000원</b></span></p>
        <div class="pills" id="pills-group"></div>
        <p class="lbl sec" style="margin:8px 0 6px;">1:1 개인<span id="rate-personal-slot" hidden> · 회당 <b id="rate-personal">77,000원</b></span></p>
        <div class="pills three" id="pills-personal"></div>
      </div>
      <div class="foot" id="presets-foot" hidden>
        <span class="sel-note" id="sel-note"></span>
        <button class="link" id="custom-toggle" type="button">직접 입력</button>
      </div>
      <div class="custom" id="custom" hidden>
        <select id="c-kind">
          <option value="group">6:1 그룹</option>
          <option value="personal">1:1 개인</option>
        </select>
        <div class="duo">
          <div class="inline">
            <input id="c-value" type="number" min="1" step="1" value="2" inputmode="numeric">
            <select id="c-unit" style="width:76px;"><option value="months">개월</option><option value="weeks">주</option></select>
          </div>
          <div class="inline">
            <input id="c-sessions" type="number" min="1" step="1" value="12" inputmode="numeric">
            <span class="suffix">회</span>
          </div>
        </div>
      </div>
    </section>

    <section class="card" id="panel-date">
      <div class="card-head">
        <span class="card-title">시작일</span>
      </div>
      <div class="inline">
        <input id="d-start" type="date">
        <button class="ghost" id="d-today" type="button">오늘</button>
      </div>
    </section>

    <section class="card" id="panel-refund" hidden>
      <div class="card-head">
        <span class="card-title">결제금액 · 사용 횟수</span>
        <span class="lbl" id="r-total">총 12회</span>
      </div>
      <div class="duo">
        <div class="inline">
          <input id="r-paid" inputmode="numeric" autocomplete="off" placeholder="결제금액">
          <span class="suffix">원</span>
        </div>
        <div class="inline">
          <input id="r-used" type="number" min="0" step="1" value="0" inputmode="numeric">
          <span class="suffix">회</span>
        </div>
      </div>
    </section>

    <section class="result">
      <div class="hero">
        <p class="rlabel" id="r-label">만료일</p>
        <p class="big is-empty" id="big">—</p>
        <p class="sub" id="sub">시작일을 선택하세요</p>
      </div>
      <div class="kpis" id="facts"></div>
      <button class="copy" id="copy" type="button" disabled>안내 문구 복사</button>
    </section>
  </main>
  <div class="toast" id="toast">복사했습니다</div>

<script>
(function () {
  const WEEKDAY_FULL = {월:"월요일", 화:"화요일", 수:"수요일", 목:"목요일", 금:"금요일", 토:"토요일", 일:"일요일"};
  const GROUP_RATE = 22000, PERSONAL_RATE = 77000;

  const $ = (id) => document.getElementById(id);
  const pillsGroup = $("pills-group"), pillsPersonal = $("pills-personal"), selNote = $("sel-note");
  const chipsGroup = $("chips-group"), chipsPersonal = $("chips-personal");
  const presetsBlock = $("presets-block"), footEl = $("presets-foot"), dateBlock = $("date-block");
  const labelEl = $("r-label");
  const rateGroup = $("rate-group"), ratePersonal = $("rate-personal");
  const rateGroupSlot = $("rate-group-slot"), ratePersonalSlot = $("rate-personal-slot");
  const kindSel = $("c-kind");
  const rateNote = $("rate-note"), customBox = $("custom"), customToggle = $("custom-toggle");
  const dStart = $("d-start"), rPaid = $("r-paid"), rUsed = $("r-used"), rTotal = $("r-total");
  const bigEl = $("big"), subEl = $("sub"), kpisEl = $("facts"), copyBtn = $("copy"), toastEl = $("toast");

  const KIND_LABEL = {group: "6:1 그룹", personal: "1:1 개인"};
  const KIND_UNIT = {group: "months", personal: "weeks"};
  const UNIT_SYMBOL = {months: "개월", weeks: "주"};
  const kindLabel = (kind) => KIND_LABEL[kind] || "";
  const unitSymbol = (unit) => UNIT_SYMBOL[unit] || "";

  let PRESETS = [];
  let tab = "date";
  let guideText = "", receiptText = "";
  // 만료일 탭은 종류별 기간 스테퍼 두 줄을 늘 보여 주고, 선택된 종류(state.kind)의 기간으로 만료일을 계산한다.
  const state = {
    kind: "group", presetId: "g12", unit: "months", value: 2, sessions: 12, customMode: false,
    rows: {group: 2, personal: 10},
    lastSessions: {group: 12, personal: 15},
  };

  const won = (n) => Number(n).toLocaleString("ko-KR") + "원";
  const pad = (n) => String(n).padStart(2, "0");
  const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };

  function bridge() { return window.pywebview && window.pywebview.api ? window.pywebview.api : null; }

  async function callApi(name, payload) {
    const api = bridge();
    if (api && api[name]) {
      try { return payload === undefined ? await api[name]() : await api[name](payload); }
      catch (e) { return {ok: false, error: "계산기를 불러오지 못했습니다."}; }
    }
    try {
      const res = await fetch("/api/" + name, {
        method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload || {})
      });
      return await res.json();
    } catch (e) {
      return {ok: false, error: "계산기를 불러오지 못했습니다."};
    }
  }

  function membership() {
    const p = state.presetId ? PRESETS.find((x) => x.id === state.presetId) : null;
    return {
      label: p ? p.label : kindLabel(state.kind),
      unit: state.unit, value: state.value, sessions: state.sessions,
      perSession: p ? p.per_session : (state.kind === "group" ? GROUP_RATE : PERSONAL_RATE),
      periodText: state.value + unitSymbol(state.unit), price: p ? p.price : null,
      kind: state.kind, custom: !p,
    };
  }

  function pillHtml(p) {
    return '<button type="button" class="pill' + (state.presetId === p.id ? " is-active" : "") +
      '" data-id="' + p.id + '">' + p.sessions + "회</button>";
  }

  function chipHtml(p) {
    return '<button type="button" class="chip' + (state.presetId === p.id ? " is-active" : "") +
      '" data-id="' + p.id + '">' + p.sessions + "회</button>";
  }

  function renderPresets() {
    pillsGroup.innerHTML = PRESETS.filter((p) => p.kind === "group").map(pillHtml).join("");
    pillsPersonal.innerHTML = PRESETS.filter((p) => p.kind === "personal").map(pillHtml).join("");
    chipsGroup.innerHTML = PRESETS.filter((p) => p.kind === "group").map(chipHtml).join("");
    chipsPersonal.innerHTML = PRESETS.filter((p) => p.kind === "personal").map(chipHtml).join("");
    rateGroup.textContent = won(GROUP_RATE);
    ratePersonal.textContent = won(PERSONAL_RATE);
    syncRateVisibility();
    syncSteppers();
    const m = membership();
    // 요약 줄은 두 탭 모두 횟수·소진기간만 (정가 금액은 결제금액 입력과 헷갈리므로 표시하지 않는다)
    selNote.textContent = m.custom
      ? m.label + " " + m.periodText + " · " + m.sessions + "회"
      : m.sessions + "회 · " + m.periodText;
    rTotal.textContent = "총 " + m.sessions + "회";
  }

  // 두 줄 스테퍼를 현재 선택에 맞춘다. 선택된 종류 줄만 인디고로 강조한다.
  function syncSteppers() {
    document.querySelectorAll(".mrow").forEach((row) => {
      const kind = row.dataset.kind;
      const active = state.kind === kind;
      const value = active ? state.value : state.rows[kind];
      row.classList.toggle("is-active", active);
      const num = row.querySelector(".stepnum");
      if (document.activeElement !== num) num.value = value;
      row.querySelector(".stepunit").textContent = unitSymbol(active ? state.unit : KIND_UNIT[kind]);
      row.querySelector('[data-step="-1"]').disabled = value <= 1;
    });
  }

  function selectPreset(p) {
    state.kind = p.kind;
    state.presetId = p.id;
    state.value = p.period_value;
    state.unit = p.period_unit;
    state.sessions = p.sessions;
    state.rows[p.kind] = p.period_value;
    state.lastSessions[p.kind] = p.sessions;
    renderPresets();
    refresh();
  }

  // 스테퍼·직접 타이핑: 그 줄의 단위(그룹=개월, 개인=주)로 기간만 바꾼다.
  function setPeriod(kind, value) {
    const v = Math.min(Math.max(Math.trunc(Number(value) || 1), 1), 99);
    state.kind = kind;
    state.presetId = null;
    state.unit = KIND_UNIT[kind];
    state.value = v;
    state.rows[kind] = v;
    state.sessions = state.lastSessions[kind] || state.sessions;
    renderPresets();
    refresh();
  }

  // 탭별로 보이는 블록 정리: 만료일 탭=스테퍼 두 줄, 환불 탭=프리셋·단가·직접 입력
  function syncPanels() {
    const isDate = tab === "date";
    dateBlock.hidden = !isDate;
    presetsBlock.hidden = isDate || state.customMode;
    footEl.hidden = isDate;
    customBox.hidden = isDate || !state.customMode;
    customBox.classList.toggle("is-flush", state.customMode);
    customToggle.textContent = state.customMode ? "프리셋" : "직접 입력";
  }

  // 단가(회당 차감액)는 환불 탭에서만 보여준다. 만료일 탭은 금액 없이 종류만.
  function syncRateVisibility() {
    const show = tab === "refund";
    rateGroupSlot.hidden = !show;
    ratePersonalSlot.hidden = !show;
    kindSel.options[0].textContent = "6:1 그룹" + (show ? " · 회당 " + won(GROUP_RATE) : "");
    kindSel.options[1].textContent = "1:1 개인" + (show ? " · 회당 " + won(PERSONAL_RATE) : "");
  }

  function syncCustom() {
    $("c-kind").value = state.kind;
    $("c-value").value = state.value;
    $("c-unit").value = state.unit;
    $("c-sessions").value = state.sessions;
  }

  function setCustomMode(on) {
    state.customMode = on;
    if (on) {
      state.presetId = null;
      syncCustom();
    } else {
      const first = PRESETS.find((p) => p.kind === state.kind) || PRESETS[0];
      if (first) {
        state.presetId = first.id;
        state.value = first.period_value;
        state.unit = first.period_unit;
        state.sessions = first.sessions;
        state.rows[first.kind] = first.period_value;
        state.lastSessions[first.kind] = first.sessions;
      }
    }
    syncPanels();
    renderPresets();
    refresh();
  }

  function setBig(text, opts) {
    bigEl.textContent = text;
    bigEl.classList.toggle("is-empty", !!(opts && opts.empty));
  }

  function setSub(text, isError) {
    subEl.textContent = text;
    subEl.classList.toggle("is-error", !!isError);
  }

  function setFacts(rows) {
    kpisEl.classList.toggle("is-single", rows.length === 1);
    kpisEl.innerHTML = rows.map((r) =>
      '<div class="kpi"><span class="k">' + r.k + '</span><span class="v">' + r.v + "</span>" +
      (r.small ? '<span class="s">' + r.small + "</span>" : "") + "</div>").join("");
  }

  function emptyState(text, copyLabel) {
    setBig("—", {empty: true});
    setSub(text);
    setFacts([]);
    copyBtn.textContent = copyLabel;
    copyBtn.disabled = true;
    guideText = receiptText = "";
  }

  // 스테퍼를 빠르게 연타하면 늦게 온 응답이 화면을 덮어쓸 수 있어 마지막 요청만 반영한다.
  let calcSeq = 0;

  async function refreshDate() {
    const seq = ++calcSeq;
    const m = membership();
    const label = m.custom ? m.label + " " + m.periodText : m.label;
    const out = await callApi("date_calc", {start: dStart.value, value: m.value, unit: m.unit, label: label});
    if (seq !== calcSeq) return;
    labelEl.textContent = "만료일";
    copyBtn.textContent = "안내 문구 복사";

    if (!out || !out.ok) {
      emptyState((out && out.error) || "시작일을 선택하세요", "안내 문구 복사");
      if (out && out.error) setSub(out.error, true);
      return;
    }
    setBig(out.expiry, {});
    setSub((WEEKDAY_FULL[out.expiry_weekday] || "") + " · " + m.periodText);
    setFacts([
      {k: "시작일", v: out.start_text}
    ]);
    guideText = out.guide_text;
    copyBtn.disabled = false;
  }

  async function refreshRefund() {
    const seq = ++calcSeq;
    const m = membership();
    labelEl.textContent = "최종 환불금액";
    copyBtn.textContent = "환불 내역 복사";
    const digits = rPaid.value.replace(/[^\d]/g, "");
    if (!digits) { emptyState("결제금액을 입력하면 계산됩니다", "환불 내역 복사"); return; }

    const out = await callApi("refund_calc", {
      paid: digits, used: rUsed.value === "" ? "0" : rUsed.value,
      per_session: m.perSession, sessions: m.sessions, label: m.label
    });
    if (seq !== calcSeq) return;
    if (!out || !out.ok) {
      emptyState((out && out.error) || "계산하지 못했습니다", "환불 내역 복사");
      if (out && out.error) setSub(out.error, true);
      return;
    }
    setBig(out.refund_text, {});
    setSub(out.refundable
      ? out.used + "회 사용 · " + out.remaining_sessions + "회 남음"
      : "차감 합계가 결제금액을 넘어 환불금액이 없습니다");
    setFacts([
      {k: "결제금액", v: out.paid_text},
      {k: "위약금 10%", v: out.penalty_text},
      {k: "사용 차감", v: out.usage_text, small: out.usage_detail},
      {k: "잔여 횟수", v: out.remaining_sessions === null ? "—" : out.remaining_sessions + "회", small: "총 " + m.sessions + "회 중"}
    ]);
    receiptText = out.receipt_text;
    copyBtn.disabled = false;
  }

  function refresh() {
    if (tab === "date") refreshDate(); else refreshRefund();
  }

  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add("is-shown");
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove("is-shown"), 1600);
  }

  async function copyText(text) {
    if (!text) return;
    let done = false;
    const api = bridge();
    if (api && api.copy) {
      try { done = await api.copy(text); } catch (e) { done = false; }
    }
    if (!done && navigator.clipboard) {
      try { await navigator.clipboard.writeText(text); done = true; } catch (e) { done = false; }
    }
    if (!done) {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { done = document.execCommand("copy"); } catch (e) { done = false; }
      document.body.removeChild(ta);
    }
    showToast(done ? "복사했습니다" : "복사하지 못했습니다");
  }

  function switchTab(next) {
    tab = next;
    document.querySelectorAll(".seg-btn").forEach((el) => el.classList.toggle("is-active", el.dataset.tab === next));
    $("panel-date").hidden = next !== "date";
    $("panel-refund").hidden = next !== "refund";
    syncRateVisibility();
    syncPanels();
    refresh();
  }

  async function callWindow(name, arg) {
    const api = bridge();
    if (!api || !api[name]) return null;
    try { return arg === undefined ? await api[name]() : await api[name](arg); }
    catch (e) { return null; }
  }

  async function initWindowState() {
    const st = await callWindow("get_window_state");
    if (st && typeof st.always_on_top === "boolean") {
      $("btn-pin").classList.toggle("is-on", st.always_on_top);
    }
    const upd = await callWindow("check_update");
    if (upd && upd.available) {
      const btn = $("btn-update");
      btn.hidden = false;
      btn.title = "새 버전 v" + upd.latest;
      btn.onclick = () => callWindow("open_release", upd.url || "");
    }
  }

  function bind() {
    document.addEventListener("click", (e) => {
      const chip = e.target.closest(".chip, .pill");
      if (chip) {
        const p = PRESETS.find((x) => x.id === chip.dataset.id);
        if (p) {
          state.customMode = false;
          selectPreset(p);
          syncPanels();
        }
        return;
      }
      const row = e.target.closest(".mrow");
      if (row) {
        const kind = row.dataset.kind;
        if (state.kind !== kind) setPeriod(kind, state.rows[kind]);
        return;
      }
      const tabBtn = e.target.closest(".seg-btn");
      if (tabBtn) switchTab(tabBtn.dataset.tab);
    });

    // − / + 스테퍼와 가운데 숫자칸 직접 입력 (그룹=개월, 개인=주)
    document.querySelectorAll(".step").forEach((btn) => {
      btn.addEventListener("click", () => {
        const kind = btn.dataset.kind;
        const cur = state.kind === kind ? state.value : state.rows[kind];
        setPeriod(kind, cur + Number(btn.dataset.step));
      });
    });
    document.querySelectorAll(".stepnum").forEach((input) => {
      const kind = input.dataset.kind;
      input.addEventListener("focus", () => {
        if (state.kind !== kind) setPeriod(kind, state.rows[kind]);
      });
      input.addEventListener("input", () => {
        const v = parseInt(input.value, 10);
        setPeriod(kind, Number.isFinite(v) ? v : 1);
      });
      input.addEventListener("blur", () => {
        input.value = state.kind === kind ? state.value : state.rows[kind];
      });
    });

    customToggle.addEventListener("click", () => setCustomMode(!state.customMode));
    $("c-kind").addEventListener("change", (e) => { state.kind = e.target.value; state.presetId = null; renderPresets(); refresh(); });
    $("c-value").addEventListener("input", (e) => {
      const v = parseInt(e.target.value, 10);
      state.value = Number.isFinite(v) && v > 0 ? v : 1;
      state.presetId = null;
      if (state.unit === KIND_UNIT[state.kind]) state.rows[state.kind] = state.value;
      renderPresets(); refresh();
    });
    $("c-unit").addEventListener("change", (e) => {
      state.unit = e.target.value; state.presetId = null;
      if (state.unit === KIND_UNIT[state.kind]) state.rows[state.kind] = state.value;
      renderPresets(); refresh();
    });
    $("c-sessions").addEventListener("input", (e) => {
      const v = parseInt(e.target.value, 10);
      state.sessions = Number.isFinite(v) && v > 0 ? v : 1;
      state.lastSessions[state.kind] = state.sessions;
      renderPresets(); refresh();
    });

    dStart.addEventListener("change", refreshDate);
    dStart.addEventListener("input", refreshDate);
    $("d-today").addEventListener("click", () => { dStart.value = todayISO(); refreshDate(); });

    rPaid.addEventListener("input", (e) => {
      const digits = e.target.value.replace(/[^\d]/g, "");
      e.target.value = digits ? Number(digits).toLocaleString("ko-KR") : "";
      refreshRefund();
    });
    rUsed.addEventListener("input", refreshRefund);

    copyBtn.addEventListener("click", () => copyText(tab === "date" ? guideText : receiptText));

    $("btn-min").addEventListener("click", () => callWindow("minimize"));
    $("btn-close").addEventListener("click", () => callWindow("close"));
    $("btn-pin").addEventListener("click", async () => {
      const nowOn = !$("btn-pin").classList.contains("is-on");
      const result = await callWindow("set_on_top", nowOn);
      $("btn-pin").classList.toggle("is-on", result === null ? nowOn : !!result);
    });
  }

  async function init() {
    bind();
    dStart.value = todayISO();
    const out = await callApi("presets");
    PRESETS = (out && out.presets) || [];
    if (!PRESETS.length) { rateNote.textContent = "회원권 정보를 불러오지 못했습니다"; return; }
    if (!PRESETS.some((p) => p.id === state.presetId)) {
      const first = PRESETS[0];
      state.presetId = first.id;
      state.kind = first.kind;
      state.value = first.period_value;
      state.unit = first.period_unit;
      state.sessions = first.sessions;
    }
    ["group", "personal"].forEach((kind) => {
      const p = PRESETS.find((x) => x.kind === kind);
      if (p) { state.rows[kind] = p.period_value; state.lastSessions[kind] = p.sessions; }
    });
    renderPresets();
    switchTab("date");
    initWindowState();
  }

  let booted = false;
  function boot() { if (booted) return; booted = true; init(); }
  window.addEventListener("pywebviewready", boot);
  document.addEventListener("DOMContentLoaded", () => {
    if (!window.pywebview) boot();
    else setTimeout(boot, 1500);
  });
})();
</script>
</body>
</html>
