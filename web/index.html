<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>필라테스 계산기</title>
<style>
  :root{
    --bg:#f5f5f2; --surface:#ffffff; --ink:#191917; --muted:#8c8c84; --line:#e7e6e0;
    --accent:#2f4a3f; --accent-dark:#263d34; --accent-soft:#eef1ed; --danger:#a3452f;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--ink); overflow:hidden; user-select:none;
    box-shadow:inset 0 0 0 1px #dedcd4;
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,-apple-system,sans-serif;
    font-size:12.5px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  /* ---------- 상단 미니 헤더 (드래그 영역) ---------- */
  .bar{
    height:42px; display:flex; align-items:center; gap:6px; padding:0 6px 0 12px;
    background:var(--surface); border-bottom:1px solid var(--line);
    -webkit-app-region:drag;
  }
  .bar h1{
    margin:0; font-size:11.5px; font-weight:600; letter-spacing:-.01em; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .drag{flex:1 1 auto; min-width:0; height:100%; display:flex; align-items:center; -webkit-app-region:drag;}
  .seg{display:flex; gap:2px; padding:2px; background:#eeede8; border-radius:7px; margin-left:auto; -webkit-app-region:no-drag;}
  .seg-btn{
    border:0; background:transparent; border-radius:5px; padding:4px 9px; font:inherit;
    font-size:10.5px; color:#6f6f67; cursor:pointer; white-space:nowrap;
  }
  .seg-btn.is-active{background:#fff; color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .win{display:flex; align-items:center; gap:1px; -webkit-app-region:no-drag;}
  .wbtn{
    border:0; background:transparent; color:#83837b; width:22px; height:22px; border-radius:6px;
    font:inherit; font-size:11px; line-height:1; cursor:pointer; display:grid; place-items:center;
    padding:0; transition:background .12s,color .12s;
  }
  .wbtn:hover{background:#eeede8; color:var(--ink);}
  .wbtn.is-on{background:var(--accent-soft); color:var(--accent);}
  .wbtn.close:hover{background:#f3e3df; color:#9c3a24;}
  .upd{
    border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent);
    border-radius:20px; padding:3px 8px; font:inherit; font-size:10px; font-weight:600; cursor:pointer;
    white-space:nowrap;
  }
  .upd:hover{background:#e3ebe5;}

  /* ---------- 본문 ---------- */
  main{
    height:calc(100% - 42px); padding:9px 10px 10px; display:flex; flex-direction:column;
    gap:8px; overflow:hidden;
  }
  .block{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 10px 10px;}
  .row-head{display:flex; align-items:baseline; justify-content:space-between; gap:6px; margin-bottom:6px;}
  .lbl{font-size:10.5px; color:#6d6d65; letter-spacing:.02em;}
  .hint{font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .pills{display:grid; grid-template-columns:repeat(4,1fr); gap:5px;}
  .pills.three{grid-template-columns:repeat(3,1fr);}
  .pill{
    border:1px solid var(--line); background:#fbfbf9; border-radius:7px; padding:5px 0;
    font:inherit; font-size:11.5px; font-weight:500; color:#3c3c36; cursor:pointer;
    transition:border-color .12s,background .12s,color .12s;
  }
  .pill:hover{border-color:#cdccc4;}
  .pill.is-active{border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:600;}
  .foot{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:7px;}
  .sel-note{font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .link{border:0; background:transparent; padding:0; font:inherit; font-size:10.5px; color:#6d6d65; text-decoration:underline; text-underline-offset:3px; cursor:pointer; white-space:nowrap;}
  .link:hover{color:var(--ink);}
  .custom{margin-top:8px; padding-top:8px; border-top:1px solid var(--line); display:grid; gap:6px;}
  .inline{display:flex; align-items:center; gap:5px;}
  input,select{
    width:100%; font:inherit; font-size:12px; color:inherit; background:#fff; border:1px solid var(--line);
    border-radius:7px; padding:7px 9px; outline:none; transition:border-color .12s,box-shadow .12s;
  }
  input:focus,select:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(47,74,63,.08);}
  input::placeholder{color:#b7b6ad;}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;appearance:textfield;}
  .suffix{font-size:10.5px; color:var(--muted); white-space:nowrap;}
  .ghost{
    border:1px solid var(--line); background:#fff; border-radius:7px; padding:7px 10px; font:inherit;
    font-size:11px; color:#63635b; cursor:pointer; white-space:nowrap;
  }
  .ghost:hover{border-color:#cdccc4; color:var(--ink);}
  .duo{display:grid; grid-template-columns:1.35fr 1fr; gap:6px;}

  /* ---------- 결과 ---------- */
  .result{
    flex:1; min-height:0; background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:11px 12px 12px; display:flex; flex-direction:column; overflow:hidden;
  }
  .rlabel{margin:0; font-size:10.5px; color:var(--muted);}
  .big{
    margin:5px 0 0; font-size:31px; font-weight:600; line-height:1.1; letter-spacing:-.025em;
    font-variant-numeric:tabular-nums;
  }
  .big.is-empty{color:#c7c6bd;}
  .big.is-refund{color:var(--accent);}
  .sub{margin:4px 0 0; font-size:11px; color:var(--muted); min-height:15px;}
  .sub.is-error{color:var(--danger);}
  .facts{
    margin-top:auto; padding-top:9px; border-top:1px solid var(--line);
    display:grid; gap:4px; overflow-y:auto; min-height:0; scrollbar-width:thin;
  }
  .facts::-webkit-scrollbar{width:4px;}
  .facts::-webkit-scrollbar-thumb{background:#deddd6; border-radius:4px;}
  .fact{display:flex; align-items:baseline; justify-content:space-between; gap:8px; font-size:11px;}
  .fact .k{color:var(--muted);}
  .fact .v{font-variant-numeric:tabular-nums; font-weight:500; text-align:right;}
  .fact .v small{display:block; font-size:9.5px; font-weight:400; color:var(--muted);}
  .copy{
    margin-top:10px; width:100%; border:0; border-radius:8px; padding:9px; background:var(--accent);
    color:#fff; font:inherit; font-size:12px; font-weight:500; cursor:pointer; transition:background .12s;
  }
  .copy:hover{background:var(--accent-dark);}
  .copy:disabled{background:#d3d2ca; cursor:default;}
  .toast{
    position:fixed; left:50%; bottom:14px; transform:translate(-50%,6px); background:#1d1d1a; color:#fff;
    font-size:10.5px; padding:6px 12px; border-radius:20px; opacity:0; pointer-events:none;
    transition:opacity .16s,transform .16s; z-index:9;
  }
  .toast.is-shown{opacity:1; transform:translate(-50%,0);}

  /* 창을 최소 높이까지 줄였을 때 */
  @media (max-height:520px){
    main{padding:7px 8px 8px; gap:6px; overflow-y:auto;}
    .block{padding:7px 9px 8px;}
    .pill{padding:3px 0; font-size:11px;}
    .result{flex:0 0 auto;}
    .big{font-size:25px;}
    .facts{gap:2px; padding-top:7px; overflow:visible;}
    .fact{font-size:10.5px;}
    .copy{padding:8px; margin-top:8px;}
  }
</style>
</head>
<body>
  <header class="bar" id="dragbar">
    <div class="drag pywebview-drag-region"><h1>필라테스 계산기</h1></div>
    <nav class="seg">
      <button class="seg-btn is-active" data-tab="date" type="button">만료일</button>
      <button class="seg-btn" data-tab="refund" type="button">환불</button>
    </nav>
    <div class="win">
      <button class="upd" id="btn-update" type="button" hidden>업데이트</button>
      <button class="wbtn is-on" id="btn-pin" type="button" title="항상 위 고정" aria-label="항상 위 고정">📌</button>
      <button class="wbtn" id="btn-min" type="button" title="최소화" aria-label="최소화">—</button>
      <button class="wbtn close" id="btn-close" type="button" title="닫기" aria-label="닫기">✕</button>
    </div>
  </header>

  <main>
    <section class="block">
      <div class="row-head">
        <span class="lbl">회원권</span>
        <span class="hint" id="rate-note"></span>
      </div>
      <div class="presets" id="presets-block">
        <p class="lbl" style="margin:0 0 5px;">6:1 그룹</p>
        <div class="pills" id="pills-group"></div>
        <p class="lbl" style="margin:8px 0 5px;">1:1 개인</p>
        <div class="pills three" id="pills-personal"></div>
      </div>
      <div class="foot">
        <span class="sel-note" id="sel-note"></span>
        <button class="link" id="custom-toggle" type="button">직접 입력</button>
      </div>
      <div class="custom" id="custom" hidden>
        <select id="c-kind">
          <option value="group">6:1 그룹 · 회당 22,000원</option>
          <option value="personal">1:1 개인 · 회당 77,000원</option>
        </select>
        <div class="duo">
          <div class="inline">
            <input id="c-value" type="number" min="1" step="1" value="2" inputmode="numeric">
            <select id="c-unit" style="width:74px;"><option value="months">개월</option><option value="weeks">주</option></select>
          </div>
          <div class="inline">
            <input id="c-sessions" type="number" min="1" step="1" value="12" inputmode="numeric">
            <span class="suffix">회</span>
          </div>
        </div>
      </div>
    </section>

    <section class="block" id="panel-date">
      <div class="row-head">
        <span class="lbl">시작일 (첫 수업일)</span>
        <span class="hint">시작일 포함</span>
      </div>
      <div class="inline">
        <input id="d-start" type="date">
        <button class="ghost" id="d-today" type="button">오늘</button>
      </div>
    </section>

    <section class="block" id="panel-refund" hidden>
      <div class="row-head">
        <span class="lbl">결제금액 · 사용 횟수</span>
        <span class="hint" id="r-total">총 12회</span>
      </div>
      <div class="duo">
        <div class="inline">
          <input id="r-paid" inputmode="numeric" autocomplete="off" placeholder="결제금액">
          <span class="suffix">원</span>
        </div>
        <div class="inline">
          <input id="r-used" type="number" min="0" step="1" value="0" inputmode="numeric">
          <span class="suffix">회</span>
        </div>
      </div>
    </section>

    <section class="result">
      <p class="rlabel" id="r-label">만료일</p>
      <p class="big is-empty" id="big">—</p>
      <p class="sub" id="sub">시작일을 선택하세요</p>
      <div class="facts" id="facts"></div>
      <button class="copy" id="copy" type="button" disabled>안내 문구 복사</button>
    </section>
  </main>
  <div class="toast" id="toast">복사했습니다</div>

<script>
(function () {
  const WEEKDAY_FULL = {월:"월요일", 화:"화요일", 수:"수요일", 목:"목요일", 금:"금요일", 토:"토요일", 일:"일요일"};
  const GROUP_RATE = 22000, PERSONAL_RATE = 77000;

  const $ = (id) => document.getElementById(id);
  const pillsGroup = $("pills-group"), pillsPersonal = $("pills-personal"), selNote = $("sel-note");
  const presetsBlock = $("presets-block");
  const rateNote = $("rate-note"), customBox = $("custom"), customToggle = $("custom-toggle");
  const dStart = $("d-start"), rPaid = $("r-paid"), rUsed = $("r-used"), rTotal = $("r-total");
  const bigEl = $("big"), subEl = $("sub"), factsEl = $("facts"), copyBtn = $("copy"), toastEl = $("toast");
  const labelEl = $("r-label");

  let PRESETS = [];
  let tab = "date";
  let guideText = "", receiptText = "";
  const state = {kind: "group", presetId: "g12", unit: "months", value: 2, sessions: 12};

  const won = (n) => Number(n).toLocaleString("ko-KR") + "원";
  const pad = (n) => String(n).padStart(2, "0");
  const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };

  function bridge() { return window.pywebview && window.pywebview.api ? window.pywebview.api : null; }

  async function callApi(name, payload) {
    const api = bridge();
    if (api && api[name]) {
      try { return payload === undefined ? await api[name]() : await api[name](payload); }
      catch (e) { return {ok: false, error: "계산기를 불러오지 못했습니다."}; }
    }
    try {
      const res = await fetch("/api/" + name, {
        method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload || {})
      });
      return await res.json();
    } catch (e) {
      return {ok: false, error: "계산기를 불러오지 못했습니다."};
    }
  }

  function membership() {
    if (state.presetId) {
      const p = PRESETS.find((x) => x.id === state.presetId);
      if (p) {
        return {label: p.label, unit: p.period_unit, value: p.period_value, sessions: p.sessions,
                perSession: p.per_session, periodText: p.period_label, price: p.price, kind: p.kind, custom: false};
      }
    }
    const kindLabel = state.kind === "group" ? "6:1 그룹" : "1:1 개인";
    const unitText = state.unit === "months" ? "개월" : "주";
    return {label: kindLabel + " 직접 입력", unit: state.unit, value: state.value, sessions: state.sessions,
            perSession: state.kind === "group" ? GROUP_RATE : PERSONAL_RATE,
            periodText: state.value + unitText, price: null, kind: state.kind, custom: true};
  }

  function pillHtml(p) {
    return '<button type="button" class="pill' + (state.presetId === p.id ? " is-active" : "") +
      '" data-id="' + p.id + '">' + p.sessions + "회</button>";
  }

  function renderPresets() {
    pillsGroup.innerHTML = PRESETS.filter((p) => p.kind === "group").map(pillHtml).join("");
    pillsPersonal.innerHTML = PRESETS.filter((p) => p.kind === "personal").map(pillHtml).join("");
    const m = membership();
    rateNote.textContent = "회당 " + won(m.perSession) + " 차감";
    selNote.textContent = m.custom
      ? m.periodText + " · " + m.sessions + "회 · 회당 " + won(m.perSession)
      : m.sessions + "회 · " + m.periodText + (m.price ? " · " + won(m.price) : "");
    rTotal.textContent = "총 " + m.sessions + "회";
  }

  function syncCustom() {
    $("c-kind").value = state.kind;
    $("c-value").value = state.value;
    $("c-unit").value = state.unit;
    $("c-sessions").value = state.sessions;
  }

  function setCustomMode(on) {
    if (on) {
      state.presetId = null;
      presetsBlock.hidden = true;
      customBox.hidden = false;
      customToggle.textContent = "프리셋";
      syncCustom();
    } else {
      const first = PRESETS.find((p) => p.kind === state.kind) || PRESETS[0];
      state.presetId = first ? first.id : null;
      presetsBlock.hidden = false;
      customBox.hidden = true;
      customToggle.textContent = "직접 입력";
    }
    renderPresets();
    refresh();
  }

  function setBig(text, opts) {
    bigEl.textContent = text;
    bigEl.classList.toggle("is-empty", !!(opts && opts.empty));
    bigEl.classList.toggle("is-refund", !!(opts && opts.refund));
  }

  function setSub(text, isError) {
    subEl.textContent = text;
    subEl.classList.toggle("is-error", !!isError);
  }

  function setFacts(rows) {
    factsEl.innerHTML = rows.map((r) =>
      '<div class="fact"><span class="k">' + r.k + '</span><span class="v">' + r.v +
      (r.small ? "<small>" + r.small + "</small>" : "") + "</span></div>").join("");
  }

  function emptyState(text, copyLabel) {
    setBig("—", {empty: true});
    setSub(text);
    setFacts([]);
    copyBtn.textContent = copyLabel;
    copyBtn.disabled = true;
    guideText = receiptText = "";
  }

  async function refreshDate() {
    const m = membership();
    const label = m.custom ? m.label + " " + m.periodText : m.label;
    const out = await callApi("date_calc", {start: dStart.value, value: m.value, unit: m.unit, label: label});
    labelEl.textContent = "만료일";
    copyBtn.textContent = "안내 문구 복사";

    if (!out || !out.ok) {
      emptyState((out && out.error) || "시작일을 선택하세요", "안내 문구 복사");
      if (out && out.error) setSub(out.error, true);
      return;
    }
    setBig(out.expiry, {});
    setSub((WEEKDAY_FULL[out.expiry_weekday] || "") + " · " + m.periodText);
    setFacts([
      {k: "시작일", v: out.start_text},
      {k: "기간", v: m.periodText},
      {k: "총 이용일수", v: out.total_days + "일"}
    ]);
    guideText = out.guide_text;
    copyBtn.disabled = false;
  }

  async function refreshRefund() {
    const m = membership();
    labelEl.textContent = "최종 환불금액";
    copyBtn.textContent = "환불 내역 복사";
    const digits = rPaid.value.replace(/[^\d]/g, "");
    if (!digits) { emptyState("결제금액을 입력하면 계산됩니다", "환불 내역 복사"); return; }

    const out = await callApi("refund_calc", {
      paid: digits, used: rUsed.value === "" ? "0" : rUsed.value,
      per_session: m.perSession, sessions: m.sessions, label: m.label
    });
    if (!out || !out.ok) {
      emptyState((out && out.error) || "계산하지 못했습니다", "환불 내역 복사");
      if (out && out.error) setSub(out.error, true);
      return;
    }
    setBig(out.refund_text, {refund: out.refundable});
    setSub(out.refundable
      ? out.used + "회 사용 · " + out.remaining_sessions + "회 남음"
      : "차감 합계가 결제금액을 넘어 환불금액이 없습니다");
    setFacts([
      {k: "결제금액", v: out.paid_text},
      {k: "위약금 10%", v: out.penalty_text},
      {k: "사용 차감", v: out.usage_text, small: out.usage_detail},
      {k: "잔여 횟수", v: out.remaining_sessions === null ? "—" : out.remaining_sessions + "회"}
    ]);
    receiptText = out.receipt_text;
    copyBtn.disabled = false;
  }

  function refresh() {
    if (tab === "date") refreshDate(); else refreshRefund();
  }

  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add("is-shown");
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove("is-shown"), 1600);
  }

  async function copyText(text) {
    if (!text) return;
    let done = false;
    const api = bridge();
    if (api && api.copy) {
      try { done = await api.copy(text); } catch (e) { done = false; }
    }
    if (!done && navigator.clipboard) {
      try { await navigator.clipboard.writeText(text); done = true; } catch (e) { done = false; }
    }
    if (!done) {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { done = document.execCommand("copy"); } catch (e) { done = false; }
      document.body.removeChild(ta);
    }
    showToast(done ? "복사했습니다" : "복사하지 못했습니다");
  }

  function switchTab(next) {
    tab = next;
    document.querySelectorAll(".seg-btn").forEach((el) => el.classList.toggle("is-active", el.dataset.tab === next));
    $("panel-date").hidden = next !== "date";
    $("panel-refund").hidden = next !== "refund";
    refresh();
  }

  async function callWindow(name, arg) {
    const api = bridge();
    if (!api || !api[name]) return null;
    try { return arg === undefined ? await api[name]() : await api[name](arg); }
    catch (e) { return null; }
  }

  async function initWindowState() {
    const st = await callWindow("get_window_state");
    if (st && typeof st.always_on_top === "boolean") {
      $("btn-pin").classList.toggle("is-on", st.always_on_top);
    }
    const upd = await callWindow("check_update");
    if (upd && upd.available) {
      const btn = $("btn-update");
      btn.hidden = false;
      btn.title = "새 버전 v" + upd.latest;
      btn.onclick = () => callWindow("open_release", upd.url || "");
    }
  }

  function bind() {
    document.addEventListener("click", (e) => {
      const pill = e.target.closest(".pill");
      if (pill) {
        const p = PRESETS.find((x) => x.id === pill.dataset.id);
        if (p) {
          state.kind = p.kind;
          state.presetId = p.id;
          presetsBlock.hidden = false;
          customBox.hidden = true;
          customToggle.textContent = "직접 입력";
          renderPresets();
          refresh();
        }
        return;
      }
      const tabBtn = e.target.closest(".seg-btn");
      if (tabBtn) switchTab(tabBtn.dataset.tab);
    });

    customToggle.addEventListener("click", () => setCustomMode(customBox.hidden));
    $("c-kind").addEventListener("change", (e) => { state.kind = e.target.value; state.presetId = null; renderPresets(); refresh(); });
    $("c-value").addEventListener("input", (e) => {
      const v = parseInt(e.target.value, 10);
      state.value = Number.isFinite(v) && v > 0 ? v : 1;
      renderPresets(); refresh();
    });
    $("c-unit").addEventListener("change", (e) => { state.unit = e.target.value; renderPresets(); refresh(); });
    $("c-sessions").addEventListener("input", (e) => {
      const v = parseInt(e.target.value, 10);
      state.sessions = Number.isFinite(v) && v > 0 ? v : 1;
      renderPresets(); refresh();
    });

    dStart.addEventListener("change", refreshDate);
    dStart.addEventListener("input", refreshDate);
    $("d-today").addEventListener("click", () => { dStart.value = todayISO(); refreshDate(); });

    rPaid.addEventListener("input", (e) => {
      const digits = e.target.value.replace(/[^\d]/g, "");
      e.target.value = digits ? Number(digits).toLocaleString("ko-KR") : "";
      refreshRefund();
    });
    rUsed.addEventListener("input", refreshRefund);

    copyBtn.addEventListener("click", () => copyText(tab === "date" ? guideText : receiptText));

    $("btn-min").addEventListener("click", () => callWindow("minimize"));
    $("btn-close").addEventListener("click", () => callWindow("close"));
    $("btn-pin").addEventListener("click", async () => {
      const nowOn = !$("btn-pin").classList.contains("is-on");
      const result = await callWindow("set_on_top", nowOn);
      $("btn-pin").classList.toggle("is-on", result === null ? nowOn : !!result);
    });
  }

  async function init() {
    bind();
    dStart.value = todayISO();
    const out = await callApi("presets");
    PRESETS = (out && out.presets) || [];
    if (!PRESETS.length) { rateNote.textContent = "회원권 정보를 불러오지 못했습니다"; return; }
    if (!PRESETS.some((p) => p.id === state.presetId)) state.presetId = PRESETS[0].id;
    renderPresets();
    switchTab("date");
    initWindowState();
  }

  let booted = false;
  function boot() { if (booted) return; booted = true; init(); }
  window.addEventListener("pywebviewready", boot);
  document.addEventListener("DOMContentLoaded", () => {
    if (!window.pywebview) boot();
    else setTimeout(boot, 1500);
  });
})();
</script>
</body>
</html>
